<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lộ trình mẹo thi Aptis — FlashAptis</title>
  <meta name="author" content="FPT University">
  <meta name="copyright" content="FlashAptis - Made by FPT University">
  <meta name="theme-color" content="#f97316">
  <link rel="icon" type="image/png" href="assets/img/brand/favicon-48.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
  <script>try{if(localStorage.getItem("flashaptis:theme")==='"dark"')document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/core/fx.js"></script>
</head>
<body>
  <main class="page"><div class="container">
    <section class="card tips-hero mb-3">
      <div class="tips-hero-main">
        <span class="eyebrow">Lộ trình mẹo thi thực chiến</span>
        <h1 class="page-title mb-1">💡 20 mẹo ăn điểm Aptis ESOL</h1>
        <p class="page-sub mb-2">Đọc từng mẹo, làm nhiệm vụ nhỏ rồi bấm “Đánh dấu đã nắm” để mở khóa mẹo tiếp theo trên cây lộ trình.</p>
        <div class="tips-bars" id="tipBars"></div>
        <div class="tips-jump mt-2" id="tipJump"></div>
      </div>
      <div class="tips-hero-side">
        <div class="ring-lg" id="tipRing" style="--p:0"><div><b id="tipCount">0</b><span>/20 mẹo</span></div></div>
        <div class="row mt-2" style="justify-content:center;gap:6px">
          <button class="btn btn-ghost btn-sm" id="tipReset" type="button">Đặt lại</button>
        </div>
      </div>
    </section>

    <div class="list-tools mb-2">
      <div class="tabs mb-0" id="tipTabs" role="tablist"></div>
      <input class="inp list-search" id="tipSearch" type="search" placeholder="🔍 Tìm mẹo theo từ khóa…" aria-label="Tìm mẹo">
    </div>

    <div class="tips-tree" id="road"></div>
  </div></main>

  <script src="assets/js/core/common.js"></script>
  <script src="assets/js/firebase/firebase-config.js"></script>
  <script src="assets/js/firebase/cloud.js"></script>
  <script src="assets/js/firebase/plan.js"></script>
  <script>
    FA.renderShell("tips");
    const SK_META = {
      Speaking:  { ic: "🎙️", key: "speaking" },
      Listening: { ic: "🎧", key: "listening" },
      Grammar:   { ic: "🧩", key: "grammar" },
      Reading:   { ic: "📖", key: "reading" },
      Writing:   { ic: "✍️", key: "writing" },
    };
    const TIPS = [
      ["Speaking", "Trả lời Part 1 theo công thức 3 câu", "Mỗi câu Part 1 chỉ có 30 giây. Dùng khung: <b>Trả lời trực tiếp → Lý do → Ví dụ/chi tiết</b>. Ví dụ: “I live in Hanoi. I like it because the food is amazing. For example, I often eat phở near my house.”", "Tự trả lời câu “Tell me about your hometown” theo đúng 3 bước và bấm giờ 30 giây.", "exam.html#/speaking", "I live in [city]. I like it because [reason]. For example, [detail]."],
      ["Speaking", "Mô tả tranh theo thứ tự “to → nhỏ”", "Part 2: bắt đầu bằng tổng quan (<i>In this picture I can see…</i>), rồi người/vật chính, hành động (<i>is/are + V-ing</i>), bối cảnh, cuối cùng là đoán cảm xúc (<i>They look…, maybe…</i>).", "Nhìn một bức ảnh bất kỳ trên điện thoại, mô tả trong 45 giây theo thứ tự trên.", "exam.html#/speaking", "In this picture I can see... In the foreground... In the background... They look..."],
      ["Speaking", "So sánh 2 tranh bằng từ nối đối lập", "Part 3 dùng <i>while, whereas, on the other hand, both… but…</i>. Nói điểm giống trước, điểm khác sau, rồi trả lời câu hỏi kèm lý do.", "Học thuộc 4 cụm: <i>Both pictures show…, The first one…, while the second…, In contrast…</i>", "exam.html#/speaking", "Both pictures show... The first one shows..., whereas the second one shows..."],
      ["Speaking", "Part 4: ghi chú từ khóa, không viết câu", "1 phút chuẩn bị chỉ đủ ghi 3–4 từ khóa cho mỗi câu hỏi. Nói đủ 2 phút: kể chuyện (quá khứ) → cảm xúc → quan điểm chung.", "Làm Part 4 của một đề Speaking, chỉ ghi tối đa 10 từ khóa khi chuẩn bị.", "exam.html#/speaking", ""],
      ["Speaking", "Câu “câu giờ” khi bí ý", "Đừng im lặng! Dùng: <i>That's an interesting question…, Let me think…, Well, to be honest…</i> để có thêm 2–3 giây suy nghĩ mà vẫn tự nhiên.", "Thuộc lòng 3 câu câu giờ và dùng chúng trong lần luyện tiếp theo.", "flashcards.html#linking", "That's an interesting question... Well, to be honest, I would say that..."],
      ["Listening", "Đọc câu hỏi trước khi nghe", "Mỗi câu Part 1 đọc câu hỏi + 3 đáp án trước khi bấm nghe. Gạch chân từ khóa (giờ, giá, địa điểm) để biết cần bắt thông tin gì.", "Làm 5 câu Listening ở phần Ôn tập, mỗi câu đọc đáp án trước khi bấm play.", "exam.html#/gym", ""],
      ["Listening", "Cẩn thận bẫy “đổi ý”", "Đề Aptis rất hay nói một đáp án rồi sửa lại: <i>“I wanted fish… but… so I'll make pasta.”</i> Đáp án thường nằm sau <b>but, actually, instead, so</b>.", "Nghe lại một đoạn Part 1 và tìm từ “đổi ý” trong transcript.", "exam.html#/listening", ""],
      ["Listening", "Part 2–3: đáp án là từ đồng nghĩa", "Câu trả lời hiếm khi lặp lại đúng từ trong đáp án. “Half my salary goes to my landlord” = <i>rent is too expensive</i>.", "Làm Part 2 một đề Listening, sau đó đối chiếu từ đồng nghĩa trong transcript.", "exam.html#/listening", ""],
      ["Listening", "Dùng lần nghe thứ 2 để kiểm tra", "Lần 1: chọn đáp án. Lần 2: chỉ nghe để xác nhận hoặc sửa. Đừng phí lần 2 nếu đã chắc chắn — tiết kiệm thời gian cho câu khó.", "Làm trọn 1 đề Listening tính giờ.", "exam.html#/listening", ""],
      ["Grammar", "Nhận diện thì qua dấu hiệu", "<i>since/for → hiện tại hoàn thành; yesterday/last → quá khứ đơn; by the time + hiện tại → tương lai hoàn thành; when + quá khứ → quá khứ tiếp diễn/hoàn thành.</i>", "Làm 10 câu Grammar ở phần Ôn tập, gạch dấu hiệu trước khi chọn.", "exam.html#/gym", ""],
      ["Grammar", "Thuộc nhóm động từ + V-ing / to V", "<b>+ V-ing:</b> enjoy, mind, suggest, avoid, look forward to, be used to. <b>+ to V:</b> want, decide, plan, hope, afford, refuse.", "Viết 5 câu với 5 động từ trong danh sách trên.", "grammar.html#b1-10", ""],
      ["Grammar", "Câu điều kiện 3 loại", "Loại 1: If + HTĐ, will V. Loại 2: If + QKĐ (were), would V. Loại 3: If + had V3, would have V3. Gặp “If I were you” → loại 2.", "Làm một đề Grammar đầy đủ 25 phút.", "exam.html#/grammar", ""],
      ["Grammar", "Vocabulary: học theo cụm, không học từ đơn", "Phần từ vựng hay hỏi collocation: <i>make a decision, do homework, pay attention, take a risk</i>. Học cả cụm sẽ nhớ lâu và chọn nhanh hơn.", "Học hết bộ flashcard Collocation.", "flashcards.html#colloc", ""],
      ["Reading", "Part 1: đọc cả câu, không chỉ chỗ trống", "Đáp án thường phụ thuộc vào câu sau: “bring an umbrella” → trời mưa. Đọc trọn câu trước khi chọn.", "Làm Reading Part 1 trong phần Ôn tập.", "exam.html#/gym", ""],
      ["Reading", "Part 2 (Sắp xếp câu): săn đại từ và từ nối", "<i>It, this, they, the + danh từ đã nhắc</i> luôn trỏ ngược về câu trước. Từ chỉ trình tự (<i>First, Then, After that, Finally</i>) là “xương sống” của bài.", "Làm Part 2 của một đề Reading, dùng bút tô vàng đánh dấu mọi đại từ.", "exam.html#/reading", ""],
      ["Reading", "Part 3 (Opinion matching): đọc câu hỏi trước, quét ý sau", "Đọc 7 câu hỏi, gạch từ khóa, rồi quét đoạn của từng người tìm ý tương đương (thường là từ đồng nghĩa).", "Làm Part 3 dưới 8 phút.", "exam.html#/reading", ""],
      ["Reading", "Part 4 (Long text): câu đầu đoạn là chìa khóa", "Đọc câu đầu và câu cuối mỗi đoạn để nắm ý chính. Loại tiêu đề chỉ khớp một chi tiết nhỏ — tiêu đề phải bao trùm cả đoạn.", "Làm trọn một đề Reading tính giờ 35 phút.", "exam.html#/reading", ""],
      ["Writing", "Part 1–2: ngắn gọn, đúng yêu cầu số từ", "Part 1 chỉ 1–5 từ, không cần câu đầy đủ. Part 2 viết 20–30 từ, câu hoàn chỉnh, có 1 lý do.", "Làm Part 1–2 của một đề Writing trong 7 phút.", "exam.html#/writing", ""],
      ["Writing", "Part 3: trả lời + lý do + ví dụ", "Mỗi câu chat 30–40 từ: trả lời thẳng → 1 lý do (because) → ví dụ hoặc ý bổ sung (For example / Also).", "Viết 3 câu Part 3 và tự đếm từ.", "exam.html#/writing", ""],
      ["Writing", "Part 4: hai giọng văn khác nhau", "Informal: <i>Hi + tên, contractions (I'm), câu hỏi lại bạn, See you</i>. Formal: <i>Dear Sir/Madam, I am writing to…, không viết tắt, đề xuất cụ thể, Yours faithfully</i>.", "Viết trọn Part 4 một đề, sau đó soát bằng checklist ở trang kết quả.", "exam.html#/writing", "Dear Sir/Madam, I am writing to express my views regarding... Yours faithfully,"],
    ];

    const done = () => FA.store.get("tips-done", []);
    const favs = () => FA.store.get("tips-fav", []);
    const lastDone = () => FA.store.get("tips-last", null);
    let activeFilter = "all";
    let searchQ = "";

    function jumpToTip(idx) {
      if (activeFilter !== "all" || searchQ) {
        activeFilter = "all";
        searchQ = "";
        const s = document.getElementById("tipSearch");
        if (s) s.value = "";
        renderTabs();
        renderList();
      }
      const el = document.getElementById("tip-" + idx);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.classList.remove("tip-pulse");
      void el.offsetWidth;
      el.classList.add("tip-pulse");
    }

    function renderSummary() {
      const d = done();
      document.getElementById("tipCount").textContent = d.length;
      document.getElementById("tipRing").style.setProperty("--p", Math.round((d.length / TIPS.length) * 100));
      document.getElementById("tipBars").innerHTML = Object.entries(SK_META).map(([sk, m]) => {
        const idxs = TIPS.map((t, i) => (t[0] === sk ? i : -1)).filter((i) => i >= 0);
        const got = idxs.filter((i) => d.includes(i)).length;
        return `<div class="tip-mini-bar" data-sk="${m.key}"><span>${m.ic} ${sk}</span><div class="progress" style="height:6px"><i style="width:${Math.round((got / idxs.length) * 100)}%"></i></div><b>${got}/${idxs.length}</b></div>`;
      }).join("");
      const jump = document.getElementById("tipJump");
      const last = lastDone();
      const lastIdx = last && Number.isInteger(last.i) && d.includes(last.i) ? last.i : (d.length ? Math.max(...d) : -1);
      const nextIdx = TIPS.findIndex((_, k) => !d.includes(k));
      if (d.length >= TIPS.length) {
        jump.innerHTML = `<span class="pill green">🎉 Bạn đã hoàn thành trọn bộ ${TIPS.length}/${TIPS.length} mẹo!</span>`;
      } else {
        const lastTxt = lastIdx >= 0
          ? `<span>📌 Lần cuối xong: <b>Mẹo #${lastIdx + 1}</b> (${FA.esc(TIPS[lastIdx][0])})${last && last.i === lastIdx && last.at ? ` · ${FA.fmtDate(last.at)}` : ""}</span>`
          : `<span class="muted">Chưa hoàn thành mẹo nào — bắt đầu từ mẹo đầu tiên nhé!</span>`;
        jump.innerHTML = `${lastTxt}<button type="button" class="btn btn-primary btn-sm" id="tipJumpBtn">▶ ${lastIdx >= 0 ? `Tới mẹo tiếp theo (#${nextIdx + 1})` : "Bắt đầu Mẹo #1"} →</button>`;
        const btn = document.getElementById("tipJumpBtn");
        if (btn) btn.onclick = () => jumpToTip(nextIdx);
      }
    }

    function renderTabs() {
      const f = favs();
      const items = [
        ["all", "Tất cả", TIPS.length],
        ...Object.entries(SK_META).map(([sk, m]) => [sk, `${m.ic} ${sk}`, TIPS.filter((t) => t[0] === sk).length]),
        ["fav", "⭐ Đã lưu", f.length],
      ];
      document.getElementById("tipTabs").innerHTML = items.map(([k, lb, n]) =>
        `<button type="button" class="tab ${activeFilter === k ? "active" : ""}" data-tf="${k}" role="tab" aria-selected="${activeFilter === k}">${lb} <span class="tab-n">${n}</span></button>`
      ).join("");
      document.querySelectorAll("[data-tf]").forEach((b) => (b.onclick = () => { activeFilter = b.dataset.tf; renderTabs(); renderList(); }));
    }

    function renderList() {
      const d = done(), f = favs(), q = searchQ.trim().toLowerCase();
      const shown = TIPS.map((t, i) => ({ t, i })).filter(({ t, i }) => {
        if (activeFilter === "fav" && !f.includes(i)) return false;
        if (activeFilter !== "all" && activeFilter !== "fav" && t[0] !== activeFilter) return false;
        if (q) {
          const hay = (t[0] + " " + t[1] + " " + t[2] + " " + t[3]).replace(/<[^>]+>/g, " ").toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
      const road = document.getElementById("road");
      if (!shown.length) {
        road.innerHTML = `<div class="card empty"><div class="big">${activeFilter === "fav" ? "⭐" : "🔍"}</div><p>${activeFilter === "fav" ? "Bạn chưa lưu mẹo nào. Bấm nút ☆ trên thẻ mẹo để lưu lại ôn nhanh trước ngày thi." : `Không tìm thấy mẹo nào khớp “${FA.esc(searchQ)}”.`}</p></div>`;
        return;
      }
      const nextUnlock = TIPS.findIndex((_, idx) => !d.includes(idx));
      let lastSkill = "";
      let branchIdx = 0;
      const html = [];
      shown.forEach(({ t: [skill, title, body, mission, link, tpl], i }) => {
        const isDone = d.includes(i), isCurrent = !isDone && i === nextUnlock, locked = !isDone && !isCurrent, isFav = f.includes(i), meta = SK_META[skill];
        if (skill !== lastSkill) {
          lastSkill = skill;
          const allSk = TIPS.map((x, idx) => (x[0] === skill ? idx : -1)).filter((idx) => idx >= 0);
          const gotSk = allSk.filter((idx) => d.includes(idx)).length;
          html.push(`<div class="tree-stage" data-sk="${meta.key}"><span class="tree-stage-pill">${meta.ic} ${skill} <b>${gotSk}/${allSk.length}</b></span></div>`);
        }
        const side = branchIdx++ % 2 === 0 ? "left" : "right";
        html.push(`<div class="tree-row ${side} ${isDone ? "done" : ""} ${isCurrent ? "current" : ""} ${locked ? "locked" : ""}" id="tip-${i}" data-sk="${meta.key}">
          <div class="tree-node" title="${locked ? `Hoàn thành Mẹo #${i} để mở khóa` : `Mẹo #${i + 1}`}">${isDone ? "✓" : locked ? "🔒" : i + 1}</div>
          <article class="card tip-card ${isDone ? "done" : ""} ${locked ? "locked" : ""}" data-sk="${meta.key}">
            <div class="row" style="gap:8px">
              <span class="tip-num">#${i + 1}</span>
              <span class="tip-sk-pill">${meta.ic} ${skill}</span>
              ${isDone ? `<span class="pill green">✓ Đã nắm</span>` : isCurrent ? `<span class="pill hot">⚡ Đang mở</span>` : `<span class="muted" style="font-size:.82rem">🔒 Hoàn thành Mẹo #${i} để mở</span>`}
              <div class="spacer"></div>
              ${locked ? "" : `<button type="button" class="tip-fav-btn ${isFav ? "on" : ""}" data-fav="${i}" title="${isFav ? "Bỏ lưu mẹo" : "Lưu mẹo này"}" aria-label="Lưu mẹo">${isFav ? "★" : "☆"}</button>`}
            </div>
            <h3 class="mt-2 ${locked ? "mb-0" : "mb-1"}">${title}</h3>
            ${locked ? "" : `<p class="mb-2" style="color:var(--ink-2)">${body}</p>
            <div class="tip-mission">🎯 <b>Nhiệm vụ áp dụng:</b> ${mission}</div>
            <div class="row mt-2" style="gap:8px">
              ${isDone
                ? `<button type="button" class="btn btn-ghost btn-sm" data-undo="${i}">Bỏ đánh dấu</button>`
                : `<button type="button" class="btn btn-primary btn-sm" data-done="${i}">✓ Đánh dấu đã nắm</button>`}
              ${link ? `<a class="btn btn-outline btn-sm" href="${link}">Thực hành →</a>` : ""}
              ${tpl ? `<button type="button" class="btn btn-ghost btn-sm" data-copy="${FA.esc(tpl)}">📋 Chép mẫu</button>` : ""}
            </div>`}
          </article>
        </div>`);
      });
      road.innerHTML = html.join("");
      road.querySelectorAll("[data-done]").forEach((b) => (b.onclick = () => {
        const idx = +b.dataset.done;
        const cur = done();
        if (!cur.includes(idx)) FA.store.set("tips-done", [...cur, idx]);
        FA.store.set("tips-last", { i: idx, at: Date.now() });
        FA.toast("Tuyệt! Đã lưu mốc Mẹo #" + (idx + 1) + " ⚡");
        draw();
      }));
      road.querySelectorAll("[data-undo]").forEach((b) => (b.onclick = () => {
        FA.store.set("tips-done", done().filter((x) => x !== +b.dataset.undo));
        draw();
      }));
      road.querySelectorAll("[data-fav]").forEach((b) => (b.onclick = () => {
        const idx = +b.dataset.fav, cur = favs();
        FA.store.set("tips-fav", cur.includes(idx) ? cur.filter((x) => x !== idx) : [...cur, idx]);
        renderTabs(); renderList();
      }));
      road.querySelectorAll("[data-copy]").forEach((b) => (b.onclick = async () => {
        try { await navigator.clipboard.writeText(b.dataset.copy); FA.toast("Đã chép mẫu câu vào clipboard 📋"); }
        catch (e) { FA.toast("Mẫu: " + b.dataset.copy); }
      }));
    }

    function draw() { renderSummary(); renderTabs(); renderList(); }
    document.getElementById("tipSearch").oninput = (e) => { searchQ = e.target.value; renderList(); };
    document.getElementById("tipReset").onclick = async () => {
      if (await FA.confirm("Xóa toàn bộ tiến độ lộ trình mẹo?", { okText: "Xóa tiến độ", danger: true })) {
        FA.store.set("tips-done", []);
        FA.store.set("tips-last", null);
        draw();
      }
    };
    window.addEventListener("fa:synced", draw);
    draw();
  </script>
</body>
</html>
